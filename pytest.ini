[pytest]
# Scoped to the real assertion-based suites. This deliberately excludes
# scripts/test_brassica_stage.py and scripts/test_single_pot.py, which are
# manual demo scripts (no assertions) despite the test_ prefix — rename those
# to demo_* to bring them into the suite, or convert them to real tests.
testpaths = scripts/tests
python_files = test_*.py
python_functions = test_*
addopts = -q
